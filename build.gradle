plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
}

java {
    // Loom 1.19 needs Gradle to run on Java 25, so there is no point targeting anything older.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    gradlePluginPortal()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

// The plugins the conventions apply. Bumping one here and releasing updates every mod. The Loom
// and ModDevGradle versions are also encoded in the project version, so a mod sees the pins in its
// settings.gradle without reading this file.
dependencies {
    implementation 'net.fabricmc:fabric-loom:1.19.4'
    implementation 'net.neoforged:moddev-gradle:2.0.148'
    implementation 'me.modmuss50:mod-publish-plugin:2.2.0'
    implementation 'org.gradle.toolchains:foojay-resolver:1.0.0'
}

publishing {
    repositories {
        maven {
            name = 'HybridLabs'
            url = 'https://maven.dvitski.cc/releases'
            credentials {
                username = findProperty('hybridlabsMavenUser') ?: System.getenv('HYBRIDLABS_MAVEN_USER')
                password = findProperty('hybridlabsMavenPassword') ?: System.getenv('HYBRIDLABS_MAVEN_PASSWORD')
            }
        }
    }
}
