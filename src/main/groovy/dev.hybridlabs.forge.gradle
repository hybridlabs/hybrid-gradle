// The Forge project, for 1.20.1.
plugins {
    id 'dev.hybridlabs.loader'
    id 'net.neoforged.moddev.legacyforge'
    id 'dev.hybridlabs.moddev'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
}

// Forge loads the mixin configs named in the jar manifest. The refmap is left to projects that have
// Forge mixins, since reobfJar fails on an empty one.
def forgeMixins = "${mod_id}.forge.mixins.json"
if (file("src/main/resources/${forgeMixins}").exists()) {
    tasks.named('jar', Jar) {
        manifest.attributes('MixinConfigs': forgeMixins)
    }
}

dependencies {
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.0'))
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT:processor'
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.5.0'))
    compileOnly 'org.jetbrains:annotations:25.0.0'
}

pluginManager.withPlugin('org.jetbrains.kotlin.jvm') {
    dependencies {
        implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"
    }
}

// Legacy Forge runs the reobfuscated jar in production.
publishMods {
    file = tasks.named('reobfJar', Jar).flatMap { it.archiveFile }
}
